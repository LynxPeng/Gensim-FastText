[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gensim-advanced-lab"
version = "1.0.0"
description = "Chinese news representation experiments and FastText implementation analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gensim==4.4.0", "fasttext-wheel==0.9.2", "numpy==1.26.4",
  "scipy>=1.11,<1.17", "scikit-learn>=1.5,<1.8", "jieba==0.42.1",
  "matplotlib>=3.9,<3.11", "pandas>=2.2,<3", "psutil>=6,<8",
  "PyYAML>=6,<7", "requests>=2.32,<3", "pytest>=8,<10",
]

[project.scripts]
gensim-lab = "gensim_lab.cli:main"

[tool.setuptools.packages.find]
include = ["gensim_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
